{%- assign nav = "Home|/,Leistungen|/leistungen/,Galerie|/galerie/,Kontakt|/kontakt/" | split: "," -%}
<script>
  /* Einfahrt-Animation nur beim ersten Seitenaufruf pro Browser-Sitzung */
  (function () {
    var h = document.documentElement;
    try {
      if (sessionStorage.getItem('fsb-intro')) return;
      sessionStorage.setItem('fsb-intro', '1');
    } catch (e) {}
    h.classList.add('intro');
  })();
</script>
<header class="site-header">
  <div class="road" aria-hidden="true"></div>
  <div class="wrapper header-inner">
    <a class="site-brand" href="{{ "/" | relative_url }}" aria-label="FS-Birth – Startseite">
      <img class="car" src="{{ "/bilder/fsb-icon_oo.png" | relative_url }}" alt="" width="76" height="57">
      <span>FS-Birth<small>Fahrender Schlosser</small></span>
    </a>

    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Menü öffnen">
    <label for="nav-toggle" class="nav-burger" aria-hidden="true"><span></span></label>

    <nav class="site-nav" aria-label="Hauptmenü">
      {%- for item in nav -%}
        {%- assign parts = item | split: "|" -%}
        {%- assign url = parts[1] -%}
        <a href="{{ url | relative_url }}"{% if page.url == url %} aria-current="page"{% endif %}>{{ parts[0] }}</a>
      {%- endfor -%}
    </nav>
  </div>
</header>
