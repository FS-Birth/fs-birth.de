{%- comment -%}
  Vollbild-Zoom für alle Elemente mit [data-zoom].
  Klick / Enter / Leertaste: Bild zoomt aus seiner Position auf Bildschirmgröße.
  Klick, Esc oder ✕: zoomt zurück an seinen Platz.
{%- endcomment -%}
<script>
(function () {
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var DUR = 380, EASE = 'cubic-bezier(.2,.8,.2,1)';
  var open = null; // { fig, clone, overlay, btn }

  function rectForRatio(ratio) {
    var maxW = innerWidth * 0.92, maxH = innerHeight * 0.86;
    var w = Math.min(maxW, maxH * ratio), h = w / ratio;
    return { left: (innerWidth - w) / 2, top: (innerHeight - h) / 2, width: w, height: h };
  }
  function place(el, r) {
    Object.assign(el.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
  }
  /* Blättern zwischen mehreren Bildern (data-bilder="a.jpg|b.jpg") */
  function show(i) {
    var o = open; if (!o || !o.list) return;
    o.index = (i + o.list.length) % o.list.length;
    var img = o.clone.querySelector(':scope > img');
    var pre = new Image();
    pre.onload = function () {
      if (open !== o) return;
      img.src = pre.src;
      place(o.clone, rectForRatio(pre.naturalWidth / pre.naturalHeight));
      o.counter.textContent = (o.index + 1) + ' / ' + o.list.length;
      if (!reduce) img.animate([{ opacity: .3 }, { opacity: 1 }], { duration: 200 });
    };
    pre.src = o.list[o.index];
  }
  function navButton(cls, label, text, dir) {
    var b = document.createElement('button');
    b.className = 'zoom-nav ' + cls; b.type = 'button'; b.setAttribute('aria-label', label); b.textContent = text;
    b.addEventListener('click', function (e) { e.stopPropagation(); show(open.index + dir); });
    return b;
  }

  function targetRect(fig) {
    var r = fig.getBoundingClientRect();
    var img = fig.querySelector(':scope > img');
    var ratio = (img && img.naturalWidth) ? img.naturalWidth / img.naturalHeight : r.width / r.height;
    var maxW = innerWidth * 0.92, maxH = innerHeight * 0.86;
    var w = Math.min(maxW, maxH * ratio), h = w / ratio;
    return { left: (innerWidth - w) / 2, top: (innerHeight - h) / 2, width: w, height: h };
  }
  function fromTransform(from, to) {
    var s = from.width / to.width;
    return 'translate(' + (from.left - to.left) + 'px,' + (from.top - to.top) + 'px) scale(' + s + ',' + (from.height / to.height) + ')';
  }

  function zoomIn(fig) {
    if (open) return;
    var from = fig.getBoundingClientRect(), to = targetRect(fig);

    var overlay = document.createElement('div');
    overlay.className = 'zoom-overlay';
    var btn = document.createElement('button');
    btn.className = 'zoom-close'; btn.type = 'button'; btn.setAttribute('aria-label', 'Schließen'); btn.textContent = '✕';

    var clone = fig.cloneNode(true);
    clone.removeAttribute('tabindex'); clone.removeAttribute('role'); clone.removeAttribute('data-zoom');
    clone.className += ' zoom-clone';
    clone.setAttribute('role', 'dialog'); clone.setAttribute('aria-modal', 'true');
    Object.assign(clone.style, { left: to.left + 'px', top: to.top + 'px', width: to.width + 'px', height: to.height + 'px' });

    document.body.append(overlay, clone, btn);
    fig.style.visibility = 'hidden';
    document.documentElement.classList.add('zoom-open');
    open = { fig: fig, clone: clone, overlay: overlay, btn: btn, extras: [] };

    var list = fig.getAttribute('data-bilder');
    if (list) {
      open.list = list.split('|'); open.index = 0;
      var counter = document.createElement('div'); counter.className = 'zoom-counter';
      counter.textContent = '1 / ' + open.list.length; open.counter = counter;
      var prev = navButton('zoom-prev', 'Vorheriges Bild', '‹', -1);
      var next = navButton('zoom-next', 'Nächstes Bild', '›', +1);
      open.extras = [prev, next, counter];
      document.body.append(prev, next, counter);
      if (!reduce) open.extras.forEach(function (el) { el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: DUR, delay: DUR * .6, fill: 'backwards' }); });
      /* Wischen am Handy */
      var x0 = null;
      clone.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
      clone.addEventListener('touchend', function (e) {
        if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; x0 = null;
        if (Math.abs(dx) > 40) { open.swiped = true; show(open.index + (dx < 0 ? 1 : -1)); }
      });
    }

    if (!reduce) {
      clone.animate([{ transform: fromTransform(from, to), borderRadius: '12px' }, { transform: 'none', borderRadius: '8px' }], { duration: DUR, easing: EASE });
      overlay.animate([{ opacity: 0 }, { opacity: 1 }], { duration: DUR, easing: 'ease-out' });
      btn.animate([{ opacity: 0 }, { opacity: 1 }], { duration: DUR, delay: DUR * .6, fill: 'backwards' });
    }
    btn.focus();
  }

  function zoomOut() {
    if (!open) return;
    var o = open; open = null;
    o.extras.forEach(function (el) { el.remove(); });
    /* zurück zum Vorschaubild, damit das Zurückzoomen zum Original passt */
    if (o.list && o.index !== 0) {
      o.clone.querySelector(':scope > img').src = o.list[0];
      place(o.clone, targetRect(o.fig));
    }
    function done() {
      o.overlay.remove(); o.clone.remove(); o.btn.remove();
      o.fig.style.visibility = '';
      document.documentElement.classList.remove('zoom-open');
      o.fig.focus({ preventScroll: true });
    }
    if (reduce) return done();
    var to = o.clone.getBoundingClientRect(), from = o.fig.getBoundingClientRect();
    o.btn.remove();
    o.overlay.animate([{ opacity: 1 }, { opacity: 0 }], { duration: DUR, easing: 'ease-in', fill: 'forwards' });
    o.clone.animate([{ transform: 'none' }, { transform: fromTransform(from, to), borderRadius: '12px' }], { duration: DUR, easing: EASE, fill: 'forwards' })
      .finished.then(done, done);
  }

  document.addEventListener('click', function (e) {
    if (open) {
      if (open.swiped) { open.swiped = false; return; }   /* Wischen ist kein Schließen */
      if (e.target.closest('.zoom-overlay, .zoom-clone, .zoom-close')) zoomOut();
      return;
    }
    var fig = e.target.closest('[data-zoom]');
    if (fig) zoomIn(fig);
  });
  document.addEventListener('keydown', function (e) {
    if (open && e.key === 'Escape') { zoomOut(); return; }
    if (open && open.list && e.key === 'ArrowRight') { show(open.index + 1); return; }
    if (open && open.list && e.key === 'ArrowLeft') { show(open.index - 1); return; }
    var fig = !open && e.target.closest && e.target.closest('[data-zoom]');
    if (fig && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); zoomIn(fig); }
  });
  window.addEventListener('resize', function () { if (open) zoomOut(); });
})();
</script>
