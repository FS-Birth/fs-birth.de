{%- comment -%}
  Vollbild-Zoom für alle Elemente mit [data-zoom].
  Klick / Enter / Leertaste: Bild zoomt aus seiner Position auf Bildschirmgröße.
  Klick, Esc oder ✕: zoomt zurück an seinen Platz.
{%- endcomment -%}
<script>
(function () {
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var DUR = 380, EASE = 'cubic-bezier(.2,.8,.2,1)';
  var open = null; // { fig, clone, overlay, btn }

  function targetRect(fig) {
    var r = fig.getBoundingClientRect();
    var img = fig.querySelector(':scope > img');
    var ratio = (img && img.naturalWidth) ? img.naturalWidth / img.naturalHeight : r.width / r.height;
    var maxW = innerWidth * 0.92, maxH = innerHeight * 0.86;
    var w = Math.min(maxW, maxH * ratio), h = w / ratio;
    return { left: (innerWidth - w) / 2, top: (innerHeight - h) / 2, width: w, height: h };
  }
  function fromTransform(from, to) {
    var s = from.width / to.width;
    return 'translate(' + (from.left - to.left) + 'px,' + (from.top - to.top) + 'px) scale(' + s + ',' + (from.height / to.height) + ')';
  }

  function zoomIn(fig) {
    if (open) return;
    var from = fig.getBoundingClientRect(), to = targetRect(fig);

    var overlay = document.createElement('div');
    overlay.className = 'zoom-overlay';
    var btn = document.createElement('button');
    btn.className = 'zoom-close'; btn.type = 'button'; btn.setAttribute('aria-label', 'Schließen'); btn.textContent = '✕';

    var clone = fig.cloneNode(true);
    clone.removeAttribute('tabindex'); clone.removeAttribute('role'); clone.removeAttribute('data-zoom');
    clone.className += ' zoom-clone';
    clone.setAttribute('role', 'dialog'); clone.setAttribute('aria-modal', 'true');
    Object.assign(clone.style, { left: to.left + 'px', top: to.top + 'px', width: to.width + 'px', height: to.height + 'px' });

    document.body.append(overlay, clone, btn);
    fig.style.visibility = 'hidden';
    document.documentElement.classList.add('zoom-open');
    open = { fig: fig, clone: clone, overlay: overlay, btn: btn };

    if (!reduce) {
      clone.animate([{ transform: fromTransform(from, to), borderRadius: '12px' }, { transform: 'none', borderRadius: '8px' }], { duration: DUR, easing: EASE });
      overlay.animate([{ opacity: 0 }, { opacity: 1 }], { duration: DUR, easing: 'ease-out' });
      btn.animate([{ opacity: 0 }, { opacity: 1 }], { duration: DUR, delay: DUR * .6, fill: 'backwards' });
    }
    btn.focus();
  }

  function zoomOut() {
    if (!open) return;
    var o = open; open = null;
    function done() {
      o.overlay.remove(); o.clone.remove(); o.btn.remove();
      o.fig.style.visibility = '';
      document.documentElement.classList.remove('zoom-open');
      o.fig.focus({ preventScroll: true });
    }
    if (reduce) return done();
    var to = o.clone.getBoundingClientRect(), from = o.fig.getBoundingClientRect();
    o.btn.remove();
    o.overlay.animate([{ opacity: 1 }, { opacity: 0 }], { duration: DUR, easing: 'ease-in', fill: 'forwards' });
    o.clone.animate([{ transform: 'none' }, { transform: fromTransform(from, to), borderRadius: '12px' }], { duration: DUR, easing: EASE, fill: 'forwards' })
      .finished.then(done, done);
  }

  document.addEventListener('click', function (e) {
    if (open) { if (e.target.closest('.zoom-overlay, .zoom-clone, .zoom-close')) zoomOut(); return; }
    var fig = e.target.closest('[data-zoom]');
    if (fig) zoomIn(fig);
  });
  document.addEventListener('keydown', function (e) {
    if (open && e.key === 'Escape') { zoomOut(); return; }
    var fig = !open && e.target.closest && e.target.closest('[data-zoom]');
    if (fig && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); zoomIn(fig); }
  });
  window.addEventListener('resize', function () { if (open) zoomOut(); });
})();
</script>
