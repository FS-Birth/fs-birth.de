# Leistungen – Reihenfolge = Reihenfolge auf der Seite.
# "titel" erscheint auch im Anfrage-Popup und im Mail-Betreff.
- titel: Wartung
  beschreibung: >-
    Regelmäßige Wartung von Toren, Geländern, Maschinen und Stahlkonstruktionen –
    damit alles sicher und zuverlässig läuft.
- titel: Instandhaltung & Reparatur
  beschreibung: >-
    Defekt, verbogen, abgerissen? Ich komme mit der mobilen Werkstatt zu dir
    und repariere direkt vor Ort.
- titel: Metallbau
  beschreibung: >-
    Anfertigung nach Maß: Geländer, Halterungen, Gestelle, Konstruktionen und
    Einzelstücke aus Stahl, Edelstahl und Aluminium.
- titel: Sonstige Anfrage
  beschreibung: >-
    Etwas anderes im Kopf? Beschreib mir dein Vorhaben – wir finden eine Lösung.
